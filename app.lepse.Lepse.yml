id: app.lepse.Lepse
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: app.lepse.Lepse
finish-args:
  - "--socket=wayland"
  - "--socket=fallback-x11"
  - "--socket=pulseaudio"
  - "--device=dri"
  - "--share=network"
  - "--share=ipc"
  - "--talk-name=org.kde.StatusNotifierWatcher"
  # a version after wekit2gtk v2.52 seems to cause a regression that glitches css animations, disabling skia for compositing fixes it.
  - "--env=WEBKIT_USE_SKIA_FOR_COMPOSITION=0"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: >-
    /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin:/run/build/lepse/pnpm-bin
modules:
  - name: lepse
    buildsystem: simple
    build-options:
      env:
        HOME: /run/build/lepse
        CARGO_HOME: /run/build/lepse/cargo
        CARGO_NET_OFFLINE: "true"
        XDG_CACHE_HOME: /run/build/lepse/flatpak-node/cache
        XDG_DATA_HOME: /run/build/lepse/flatpak-node/data
        PNPM_CONFIG_TRUST_LOCKFILE: "true"
    sources:
      - type: git
        url: "https://github.com/aervxa/lepse.git"
        tag: v0.2.8
        commit: 3cd5570dbb661796cefb043e8c4a2bb22f1c9b8d
        x-checker-data:
          type: git
          tag-pattern: '^v(\d+\.\d+\.\d+)$' # maybe will add support fore suffixes later if needed
          version-scheme: semantic
      - cargo-sources.json
      - node-sources.json
      - type: archive
        only-arches:
          - x86_64
        url: >-
          https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.6.0.tgz
        sha512: >-
          a855819de1c9009ef75b8c21b5b68538bd4cffb0c10ba20b1d7bb173b64fb4485f3ee4f5cde6621ab98a1e83007c903e99c9bac61385963a954d44bed3425a6f
        dest: pnpm-bin
      - type: archive
        only-arches:
          - aarch64
        url: >-
          https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.6.0.tgz
        sha512: >-
          f21dac3682211c3a470d8a9964287d3d7afa92ba96d746ed6f4187546bb0ef5d26b831e51401ccb541b6a2099a1e07bacc91b5c6063863b9b05f983f2d6beb62
        dest: pnpm-bin
    build-commands:
      - cargo --offline fetch --manifest-path apps/lachesis/src-tauri/Cargo.toml
      - pnpm install --offline --frozen-lockfile --filter @lepse/lachesis...
      - >-
        pnpm --filter @lepse/lachesis tbuild -b deb
        -c '{"bundle":{"createUpdaterArtifacts":false}}'
      - >-
        install -Dm755
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/bin/lepse
        /app/bin/app.lepse.Lepse
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/applications/lepse.desktop
        /app/share/applications/app.lepse.Lepse.desktop
      - >-
        desktop-file-edit
        --set-icon=app.lepse.Lepse
        --set-key="Exec" --set-value="app.lepse.Lepse"
        --set-key="Categories" --set-value="Utility;Clock;"
        --set-key="Keywords" --set-value="aesthetic;productivity;clock;calendar;pomodoro;timer;focus;habits;"
        /app/share/applications/app.lepse.Lepse.desktop
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/icons/hicolor/128x128/apps/lepse.png
        /app/share/icons/hicolor/128x128/apps/app.lepse.Lepse.png
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/icons/hicolor/32x32/apps/lepse.png
        /app/share/icons/hicolor/32x32/apps/app.lepse.Lepse.png
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/icons/hicolor/256x256@2/apps/lepse.png
        /app/share/icons/hicolor/512x512/apps/app.lepse.Lepse.png
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/metainfo/app.lepse.Lepse.metainfo.xml
        /app/share/metainfo/app.lepse.Lepse.metainfo.xml
