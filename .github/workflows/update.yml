name: Check for updates
on:
  schedule: # for scheduling to work this file must be in the default branch
    - cron: "0 0 * * *" # run every day
  workflow_dispatch: # can be manually dispatched under GitHub's "Actions" tab

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        branch: [master] # list all branches to check

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --edit-only app.lepse.Lepse.yml

      - uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@24

      - name: Update sources
        run: ./update-sources.sh

      - name: Create Pull Request
        if: env.TAG != '' # update-sources sets TAG on env regardless of sources
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update Lepse to ${{ env.TAG }}"
          branch: update-${{ env.TAG }}
