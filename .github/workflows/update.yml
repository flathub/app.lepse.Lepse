name: Check for updates
on:
  schedule: # for scheduling to work this file must be in the default branch
    - cron: "0 0 * * 1" # run every week
  workflow_dispatch: # can be manually dispatched under GitHub's "Actions" tab

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        branch: [master] # list all branches to check

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --edit-only app.lepse.Lepse.yml

      - name: Detect new tag
        run: |
          OLD_TAG=$(git diff app.lepse.Lepse.yml | sed -n 's/^\- *tag: *//p' |  tr -d '"'"'")
          NEW_TAG=$(git diff app.lepse.Lepse.yml | sed -n 's/^\+ *tag: *//p' |  tr -d '"'"'")
          if [ -z "$NEW_TAG" ]; then
            echo "No updates to git source! skipping."
            exit 0
          fi
          echo "OLD_TAG=$OLD_TAG" >> "$GITHUB_ENV"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        if: env.NEW_TAG != ''
        with:
          node-version: 24
      - run: npm install -g pnpm@12.6.0
        if: env.NEW_TAG != ''

      - name: Update sources
        if: env.NEW_TAG != ''
        run: ./update-sources.sh

      - name: Create Pull Request
        if: env.NEW_TAG != ''
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update Lepse to ${{ env.NEW_TAG }}"
          title: "Update Lepse to ${{ env.NEW_TAG }}"
          branch: update-${{ env.NEW_TAG }}
